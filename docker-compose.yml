services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bytestream
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    restart: always

  # --- YOUR NEW LOCAL CLOUD STORAGE ---
  storage:
    image: minio/minio
    container_name: bytestream-storage
    ports:
      - "9000:9000" # For your code (API)
      - "9001:9001" # For you (Console UI)
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_CORS_ALLOW_ORIGIN: "*"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

  createbuckets:
    image: minio/mc
    depends_on:
      - storage
    entrypoint: >
      /bin/sh -c " until (/usr/bin/mc alias set localstorage http://storage:9000 minioadmin minioadmin) do echo '...waiting for storage...' && sleep 1; done; /usr/bin/mc mb localstorage/raw-videos; /usr/bin/mc mb localstorage/processed-hls; /usr/bin/mc anonymous set public localstorage/processed-hls; exit 0; "

  auth-service:
    build: ./auth-service
    env_file: ./auth-service/.env
    ports:
      - "5001:5001"
    depends_on:
      - postgres
    restart: always

  upload-service:
    build: ./upload-service
    env_file: ./upload-service/.env
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - redis
      - storage
    restart: always

  watch-service:
    build: ./watch-service
    env_file: ./watch-service/.env
    ports:
      - "3003:3003"
    depends_on:
      - postgres
      - redis
      - storage
    restart: always

  transcoder-service:
    build: ./transcoder-service-go
    env_file: ./transcoder-service/.env
    depends_on:
      - postgres
      - redis
      - storage
    restart: always

volumes:
  postgres_data:
  minio_data:
